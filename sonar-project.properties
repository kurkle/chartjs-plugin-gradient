sonar.projectKey=kurkle_chartjs-plugin-gradient
sonar.organization=kurkle

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=chartjs-plugin-gradient
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src/,scripts/,docs/,.github/workflows

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Build and maintenance scripts and the documentation site are analysed for issues but have no unit tests.
sonar.coverage.exclusions=samples/**,test/**,*.config.js,scripts/**,docs/**
sonar.test.exclusions=test/**
# docs/src/generated is written by docs/scripts/write-docs-version.cjs at build time.
sonar.exclusions=samples/**,test/**,docs/src/generated/**

# The floating v1 tag is deliberate: it is how a fix in kurkle/configs reaches
# every repository without a pull request in each one. Pinning a commit SHA
# would defeat that mechanism.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*.yml
